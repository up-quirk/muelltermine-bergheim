name: Verify app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r muelltermine_bergheim/requirements.txt
      - run: pip install --no-deps -e .
      - run: python tools/fetch_fixtures.py
      - run: python -m unittest discover -s tests -v
      - run: node --check muelltermine_bergheim/muelltermine/static/app.js
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: muelltermine_bergheim
          platforms: ${{ matrix.platform }}
          push: false
