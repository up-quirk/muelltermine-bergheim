name: Mülltermine Bergheim
version: 0.2.1
slug: muelltermine_bergheim
description: Automatische Müllkalender mit PDF-Vorschau und live testbaren Suchregeln
url: https://github.com/up-quirk/muelltermine-bergheim
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:trash-can-outline
panel_title: Mülltermine
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Ausschließlich lesender ICS-/JSON-Kalender (nur im vertrauenswürdigen lokalen Netz verwenden)
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
